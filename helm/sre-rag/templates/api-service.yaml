apiVersion: v1
kind: Service
metadata:
  name: sre-rag-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sre-rag.labels" . | nindent 4 }}
    {{- include "sre-rag.api.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "sre-rag.api.selectorLabels" . | nindent 4 }}

# ============================================================
# Network Policy: API → Only accepts traffic from ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sre-rag.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-rag.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from any pod in namespace (ingress controller, prometheus)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "sre-rag.postgresql.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
    # Allow egress to Redis
    - to:
        - podSelector:
            matchLabels:
              {{- include "sre-rag.redis.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# ============================================================
# Network Policy: PostgreSQL → Only accepts traffic from API
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sre-rag.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-rag.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sre-rag.api.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP

---
# ============================================================
# Network Policy: Redis → Only accepts traffic from API
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "sre-rag.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-rag.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sre-rag.api.selectorLabels" . | nindent 14 }}
      ports:
        - port: 6379
          protocol: TCP

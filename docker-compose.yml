services:
  # ----------------------------------------------------
  # Reverse Proxy (Public Facing)
  # ----------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: sre_rag_proxy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy_net
    depends_on:
      - api

  # ----------------------------------------------------
  # Application Backend
  # ----------------------------------------------------
  api:
    build: 
      context: ./app
      dockerfile: ../docker/Dockerfile
    container_name: sre_rag_api
    environment:
      - ENVIRONMENT=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=sre_password
      - REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    networks:
      - proxy_net
      - backend_net
    depends_on:
      - postgres
      - redis
      - jaeger

  # ----------------------------------------------------
  # Databases & Vector Engine (Isolated on internal network)
  # ----------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: sre_rag_postgres
    environment:
      - POSTGRES_DB=sre_rag
      - POSTGRES_USER=sre_user
      - POSTGRES_PASSWORD=sre_password
    networks:
      - backend_net

  redis:
    image: redis:7-alpine
    container_name: sre_rag_redis
    networks:
      - backend_net

  # ----------------------------------------------------
  # Distributed Tracing (Jaeger OpenTelemetry OTLP)
  # ----------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: sre_rag_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend_net
      - proxy_net
    ports:
      - "16686:16686"

networks:
  proxy_net:
    driver: bridge
    name: sre_rag_proxy_net
  backend_net:
    driver: bridge
    name: sre_rag_backend_net
    internal: true

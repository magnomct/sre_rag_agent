---
# Source: sre-rag/templates/api-servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sre-rag-api
  namespace: sre-rag
  labels:
    app.kubernetes.io/name: sre-rag
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sre-rag-lab
    helm.sh/chart: sre-rag-0.1.0
    environment: staging
    team: sre
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-rag-api
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - sre-rag

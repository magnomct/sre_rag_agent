---
# Source: sre-rag/templates/network-policies.yaml
# ============================================================
# Network Policy: API → Only accepts traffic from ingress
# ============================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-network-policy
  namespace: sre-rag
  labels:
    app.kubernetes.io/name: sre-rag
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: sre-rag-lab
    helm.sh/chart: sre-rag-0.1.0
    environment: staging
    team: sre
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sre-rag-api
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from any pod in namespace (ingress controller, prometheus)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
    # Allow egress to Redis
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
              app.kubernetes.io/component: cache
      ports:
        - port: 6379
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
